name: 🫘 Doubao Work Daily

run-name: "Doubao Work ${{ github.event_name == 'schedule' && 'scheduled claim' || (inputs.mode || 'query') }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "query = 只读核验；claim = 明确提交一次签到"
        required: true
        default: query
        type: choice
        options:
          - query
          - claim
  # 定时：每天北京时间 07:05 与 11:05 各运行一次
  # GitHub Actions 的 cron 使用 UTC，北京时间需减 8 小时
  # 07:05 CST = 23:05 UTC(前一天)；11:05 CST = 03:05 UTC
  schedule:
    - cron: "5 23 * * *"
    - cron: "5 3 * * *"

permissions:
  contents: read

concurrency:
  group: doubaowork-daily-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore Doubao Work check-in ledger
        uses: actions/cache/restore@v4
        with:
          path: doubaowork_state.json
          key: doubaowork-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            doubaowork-state-
      - run: pip install requests
      - name: Query only (manual query only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'query' }}
        env:
          DOUBAOWORK_COOKIES: ${{ secrets.DOUBAOWORK_COOKIES }}
          DOUBAOWORK_COOKIE: ${{ secrets.DOUBAOWORK_COOKIE }}
          DOUBAOWORK_DEVICE_ID: ${{ secrets.DOUBAOWORK_DEVICE_ID }}
          DOUBAOWORK_WEB_ID: ${{ secrets.DOUBAOWORK_WEB_ID }}
          DOUBAOWORK_FINGERPRINT: ${{ secrets.DOUBAOWORK_FINGERPRINT }}
          DOUBAOWORK_PROXY: ${{ secrets.DOUBAOWORK_PROXY }}
          DOUBAOWORK_CAMPAIGN_GROUP: ${{ vars.DOUBAOWORK_CAMPAIGN_GROUP || 'pc_incentive_task_mvp_v3' }}
          DOUBAOWORK_ALLOW_EXPLICIT_GROUP_CLAIM: ${{ vars.DOUBAOWORK_ALLOW_EXPLICIT_GROUP_CLAIM || '' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python doubaowork_daily.py --query
      - name: Claim once (schedule or explicit dispatch)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'claim') }}
        env:
          DOUBAOWORK_COOKIES: ${{ secrets.DOUBAOWORK_COOKIES }}
          DOUBAOWORK_COOKIE: ${{ secrets.DOUBAOWORK_COOKIE }}
          DOUBAOWORK_DEVICE_ID: ${{ secrets.DOUBAOWORK_DEVICE_ID }}
          DOUBAOWORK_WEB_ID: ${{ secrets.DOUBAOWORK_WEB_ID }}
          DOUBAOWORK_FINGERPRINT: ${{ secrets.DOUBAOWORK_FINGERPRINT }}
          DOUBAOWORK_PROXY: ${{ secrets.DOUBAOWORK_PROXY }}
          DOUBAOWORK_CAMPAIGN_GROUP: ${{ vars.DOUBAOWORK_CAMPAIGN_GROUP || 'pc_incentive_task_mvp_v3' }}
          DOUBAOWORK_ALLOW_EXPLICIT_GROUP_CLAIM: ${{ vars.DOUBAOWORK_ALLOW_EXPLICIT_GROUP_CLAIM || '' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python doubaowork_daily.py
      - name: Save Doubao Work check-in ledger
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'claim')) && hashFiles('doubaowork_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: doubaowork_state.json
          key: doubaowork-state-${{ github.run_id }}-${{ github.run_attempt }}
